<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sayo · Gemini Nano</title>
<style>
body{margin:0;background:#f4f4ed;color:#253d32;font:16px/1.65 system-ui,sans-serif}main{max-width:650px;margin:7vh auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}small{letter-spacing:.12em}h1{font-size:36px;line-height:1.2}button{font:inherit;background:#305d43;color:white;border:0;border-radius:9px;padding:12px 24px;cursor:pointer}button:disabled{opacity:.5}select{font:inherit;color:inherit;background:white;border:1px solid #b9c7bc;border-radius:7px;padding:6px}label{font-size:13px}#status{padding:20px;background:white;border:1px solid #d7ded4;border-radius:12px;white-space:pre-wrap}footer{font-size:13px;color:#59675d;margin-top:28px}summary{cursor:pointer}#language-note{font-size:13px;color:#59675d}
</style></head>
<body><main>
<header><small data-i18n="brand"></small><label><span data-i18n="language"></span> <select id="language"><option value="en">English</option><option value="zh-CN">简体中文</option></select></label></header>
<h1 data-i18n="title"></h1>
<p data-i18n="intro"></p>
<p data-i18n="limits"></p>
<p id="language-note" data-i18n="languageNote"></p>
<p id="status" role="status" aria-live="polite"></p>
<button id="connect" disabled data-i18n="connect"></button>
<footer><details><summary data-i18n="details"></summary><p data-i18n="help"></p><code>chrome://on-device-internals</code></details></footer>
<noscript>Enable JavaScript to connect. / 请启用 JavaScript 以连接模型。</noscript>
</main><script src="/bridge.js"></script></body></html>
