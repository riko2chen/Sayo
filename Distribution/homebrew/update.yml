name: Sync latest Sayo release
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: ['update_cask.py', 'Casks/sayo.rb.in', 'tests/**', '.github/workflows/update.yml']
permissions:
  contents: read
concurrency:
  group: update-sayo-cask
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test release validation
        run: python3 -m unittest discover -s tests -v
      - name: Verify latest published release and update Cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 update_cask.py
      - name: Commit updated Cask
        run: |
          git add Casks/sayo.rb
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Sayo Cask from published release'
          git push origin HEAD:main
